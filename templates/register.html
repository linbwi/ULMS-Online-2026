{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3 text-center">Đăng ký tài khoản thư viện</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Mã sinh viên / Mã cán bộ *</label>
          <input name="university_id" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email nội bộ (.edu.vn) *</label>
          <input type="email" name="email" class="form-control" required placeholder="ban@student.university.edu.vn">
        </div>
        <div class="mb-3">
          <label class="form-label">Họ và tên *</label>
          <input name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu *</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Xác nhận mật khẩu *</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
      </form>
      <p class="mt-3 text-center mb-0">
        Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
