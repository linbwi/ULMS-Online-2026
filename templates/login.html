{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3 text-center">Đăng nhập</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Email (.edu.vn)</label>
          <input type="email" name="email" class="form-control" required placeholder="ban@student.university.edu.vn">
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
      </form>
      <p class="mt-3 text-center mb-0">
        Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
