{% extends "base.html" %}
{% block title %}Báo cáo & thống kê{% endblock %}
{% block content %}
<h2 class="mb-3"><i class="bi bi-bar-chart"></i> Báo cáo & thống kê</h2>
<div class="row g-3">
  {% for k, v in stats.items() %}
  <div class="col-md-3">
    <div class="card p-3">
      <div class="text-muted small">{{ k }}</div>
      <div class="fs-4 fw-bold">{{ v }}</div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
